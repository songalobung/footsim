[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footsim"
version = "0.1.0"
description = "Minute-by-minute football match simulation engine (EPL first)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=14",
    "typer>=0.9",
]

[project.scripts]
footsim = "footsim.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["footsim*"]

[tool.setuptools.package-data]
"footsim.data" = ["team_names.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs the cached football-data CSVs (downloads them on first run)",
]
